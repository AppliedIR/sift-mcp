category: volatility
common_binary_dir: /opt/volatility3

tools:
  - name: vol3
    binary: vol
    recipes:
      - task: Show the memory image's operating system details
        versions: ">=2.0,<3"
        checked_on: "2.28.0"
        argv: [vol, -f, <memory image>, windows.info]
      - task: The same, rendered as JSON
        versions: ">=2.0,<3"
        checked_on: "2.28.0"
        argv: [vol, -r, json, -f, <memory image>, windows.info]
    # its package's version, from vol's own interpreter (vol prints none)
    version_argv: ["{interpreter}", "-c", "from volatility3.framework import constants; print(constants.PACKAGE_VERSION)"]
    input_style: flag
    input_flag: "-f"
    output_format: json
    timeout_seconds: 1200
    interactive: false
    description: "Volatility 3 memory forensics framework"
    fk_tool_name: "Volatility 3"
    aliases: ["Volatility 3", Volatility3, volatility, volatility3]

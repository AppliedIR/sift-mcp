category: sleuthkit

tools:
  - name: fls
    binary: fls
    recipes:
      - task: List files and folders recursively, with full paths
        versions: ">=4.0,<5"
        checked_on: "4.11.1"
        argv: [fls, -r, -p, <image>]
    help_argv: ["-h"]
    input_style: positional
    output_format: text
    timeout_seconds: 600
    interactive: false
    description: "List files and directories in a disk image"
    fk_tool_name: fls

  - name: icat
    binary: icat
    recipes:
      - task: Extract one file by its inode
        versions: ">=4.0,<5"
        checked_on: "4.11.1"
        argv: [icat, <image>, <inode>]
        notes: 'Pass save_output: true to keep it.'
    help_argv: ["-h"]
    input_style: positional
    output_format: text
    timeout_seconds: 600
    interactive: false
    description: "Extract file by inode from disk image"
    fk_tool_name: icat

  - name: mmls
    binary: mmls
    recipes:
      - task: Show the partition table
        versions: ">=4.0,<5"
        checked_on: "4.11.1"
        argv: [mmls, <image>]
    help_argv: ["-h"]
    input_style: positional
    output_format: text
    timeout_seconds: 300
    interactive: false
    description: "Display partition table layout"
    fk_tool_name: mmls

  - name: blkls
    binary: blkls
    recipes:
      - task: Extract a file system's unallocated blocks
        versions: ">=4.0,<5"
        checked_on: "4.11.1"
        argv: [blkls, <image>]
        notes: 'Pass save_output: true to keep them.'
    help_argv: ["-h"]
    input_style: positional
    output_format: text
    timeout_seconds: 3600
    interactive: false
    description: "Extract unallocated disk clusters"
    fk_tool_name: blkls

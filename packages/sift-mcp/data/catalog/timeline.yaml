category: timeline
common_binary_dir: /usr/local/bin

tools:
  - name: hayabusa
    binary: hayabusa
    input_style: flag
    input_flag: "-d"
    output_format: json
    timeout_seconds: 1800
    interactive: false
    description: >-
      Sigma-based Windows event log analyzer. Starts with a subcommand:
      `hayabusa json-timeline -d <evtx dir> -o <file> -w` (or csv-timeline;
      dfir-timeline in hayabusa 4.x). SIFT installs 3.9.0.
    fk_tool_name: Hayabusa
    common_flags:
      - flag: "json-timeline"
        description: "Subcommand: a JSONL timeline of detections (csv-timeline for CSV; dfir-timeline in 4.x)"
        required: true
      - flag: "-o"
        description: "Output file path"
        required: false
      - flag: "-w"
        description: "No wizard (--no-wizard): run without the interactive rule-selection prompts"
        required: true
      - flag: "--min-level"
        description: "Minimum alert level (informational, low, medium, high, critical)"
        required: false

  - name: log2timeline
    binary: log2timeline.py
    input_style: positional
    output_format: text
    timeout_seconds: 7200
    interactive: false
    description: "Plaso super-timeline generator"
    fk_tool_name: "Plaso (log2timeline)"

  - name: mactime
    binary: mactime
    input_style: flag
    input_flag: "-b"
    output_format: text
    timeout_seconds: 600
    interactive: false
    description: "Bodyfile to timeline converter (Sleuth Kit)"
    fk_tool_name: mactime

  - name: psort
    binary: psort.py
    input_style: positional
    output_format: text
    timeout_seconds: 3600
    interactive: false
    description: "Filter and export Plaso storage to CSV"
    fk_tool_name: psort

# Security policy: flags and binaries blocked by the execution sandbox.
# Loaded by catalog.load_security_policy() and consumed by security.py.

dangerous_flags:
  - "-e"
  - "--exec"
  - "--command"
  - "-enc"
  - "-encodedcommand"
  - "--script"
  - "--invoke"

# "-e" (any case) stays dangerous: it runs code for interpreters (perl,
# ruby, node), and pwsh's -enc/-EncodedCommand ignore case. These tools'
# -e/-E only select or extract; the check lowercases, so "-e" allows both.
tool_allowed_flags:
  bulk_extractor: ["-e", "-x"]  # enable / disable a scanner
  grep: ["-e"]                  # a pattern; -E extended regex
  egrep: ["-e"]
  fgrep: ["-e"]
  zgrep: ["-e"]
  sed: ["-e"]                   # a script; -E extended regex
  strings: ["-e"]               # the encoding (-e l for UTF-16LE)
  tshark: ["-e"]                # a field (-T fields -e); -E field options
  binwalk: ["-e"]               # extract; -E entropy
  ewfacquire: ["-e"]            # examiner name; -E evidence number

tool_blocked_flags:
  find:
    - "-exec"
    - "-execdir"
    - "-delete"
    - "-fls"
    - "-fprint"
    - "-fprint0"
    - "-fprintf"
  sed:
    - "-i"
    - "--in-place"
  tar:
    - "-x"
    - "--extract"
    - "--get"
    - "-c"
    - "--create"
    - "--delete"
    - "--append"
    - "--checkpoint-action"
    - "--use-compress-program"
    - "--to-command"
  unzip:
    - "-o"
    - "-n"

output_flags:
  - "--csv"
  - "--csvf"
  - "-o"
  - "--output"
  - "--json"
  - "--jsonl"

# Output flags of one tool only (a global -w would be wrong: AmcacheParser's
# -w is an input)
tool_output_flags:
  unzip: ["-d"]
  ewfacquire: ["-t"]
  tshark: ["-w"]
  hashdeep: ["-W"]
  psort.py: ["-w"]
  log2timeline.py: ["--storage-file"]
  vol: ["--output-dir"]
  MFTECmd: &ez_outputs ["--body", "--html", "--xml", "--dumpTo"]
  AmcacheParser: *ez_outputs
  AppCompatCacheParser: *ez_outputs
  EvtxECmd: *ez_outputs
  JLECmd: *ez_outputs
  LECmd: *ez_outputs
  PECmd: *ez_outputs
  RBCmd: *ez_outputs
  RECmd: *ez_outputs
  SBECmd: *ez_outputs
  SQLECmd: *ez_outputs
  SrumECmd: *ez_outputs
  bstrings: *ez_outputs

# Global output flags that are a switch for a tool: the next token is no output
tool_switch_flags:
  strings: ["-o"]   # print offsets
  grep: ["-o"]      # only the match
  zgrep: ["-o"]
  ls: ["-o"]        # long list without group
  hexdump: ["-o"]   # two-byte octal
  tar: ["-o"]       # no same owner

denied_binaries:
  # Filesystem destruction — no forensic use, no unblocked equivalent
  - "mkfs"
  - "mkfs.ext4"
  - "mkfs.xfs"
  - "mkfs.btrfs"
  - "mkfs.ntfs"
  # System state — no forensic use
  - "shutdown"
  - "reboot"
  - "poweroff"
  - "halt"
  - "init"
  # Process termination — timeouts handle hung tools
  - "kill"
  - "killall"
  - "pkill"
  # Environment leak — dumps gateway tokens
  - "env"
  - "printenv"
  # Raw sockets — no forensic use via run_command
  - "nc"
  - "ncat"

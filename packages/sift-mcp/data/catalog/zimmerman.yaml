category: zimmerman
common_binary_dir: /usr/local/bin

tools:
  - name: AmcacheParser
    binary: AmcacheParser
    recipes:
      - task: Parse Amcache.hve to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [AmcacheParser, -f, <Amcache.hve>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 600
    interactive: false
    description: "Parse Amcache.hve registry hive"
    fk_tool_name: AmcacheParser
  - name: PECmd
    binary: PECmd
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse Windows Prefetch files"
    fk_tool_name: PECmd
  - name: AppCompatCacheParser
    binary: AppCompatCacheParser
    recipes:
      - task: Parse the ShimCache in a SYSTEM hive to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [AppCompatCacheParser, -f, <SYSTEM hive>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse ShimCache (AppCompatCache) from SYSTEM hive"
    fk_tool_name: AppCompatCacheParser
  - name: RECmd
    binary: RECmd
    recipes:
      - task: Run a batch file of registry queries over a hive, to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [RECmd, -f, <hive>, --bn, <batch .reb file>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 600
    interactive: false
    description: "Registry Explorer command line — batch processing with --bn"
    fk_tool_name: RECmd
  - name: MFTECmd
    binary: MFTECmd
    recipes:
      - task: Parse an $MFT to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [MFTECmd, -f, <$MFT>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 1200
    interactive: false
    description: "Parse $MFT and $UsnJrnl"
    fk_tool_name: MFTECmd
  - name: EvtxECmd
    binary: EvtxECmd
    recipes:
      - task: Parse a folder of .evtx files to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [EvtxECmd, -d, <evtx folder>, --csv, <output folder>]
      - task: The same, with a maps folder other than the tool's own
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [EvtxECmd, -d, <evtx folder>, --csv, <output folder>, --maps, <maps folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 600
    interactive: false
    description: "Parse Windows Event Log (.evtx) files"
    fk_tool_name: EvtxECmd
  - name: JLECmd
    binary: JLECmd
    recipes:
      - task: Parse a folder of jump lists to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [JLECmd, -d, <AutomaticDestinations folder>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse Jump List files"
    fk_tool_name: JLECmd
  - name: LECmd
    binary: LECmd
    recipes:
      - task: Parse a folder of .lnk files to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [LECmd, -d, <folder of .lnk files>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse Windows LNK (shortcut) files"
    fk_tool_name: LECmd
  - name: SBECmd
    binary: SBECmd
    recipes:
      - task: Parse the ShellBags in a folder of user hives to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [SBECmd, -d, <folder of user hives>, --csv, <output folder>]
    input_style: flag
    input_flag: "-d"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse ShellBags from registry hives"
    fk_tool_name: SBECmd
  - name: RBCmd
    binary: RBCmd
    recipes:
      - task: Parse a Recycle Bin folder to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [RBCmd, -d, <$Recycle.Bin folder>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 300
    interactive: false
    description: "Parse Recycle Bin $I files"
    fk_tool_name: RBCmd
  - name: SrumECmd
    binary: SrumECmd
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 600
    interactive: false
    description: "Parse SRUM database"
    fk_tool_name: SrumECmd
  - name: SQLECmd
    binary: SQLECmd
    recipes:
      - task: Parse a folder of SQLite databases to CSV
        versions: ">=2026.0,<2027"
        checked_on: "2026.5.0"
        argv: [SQLECmd, -d, <folder of databases>, --csv, <output folder>]
    input_style: flag
    input_flag: "-f"
    output_format: csv
    timeout_seconds: 600
    interactive: false
    description: "Parse SQLite databases (browser history, etc.)"
    fk_tool_name: SQLECmd
  - name: bstrings
    binary: bstrings
    recipes:
      - task: Extract strings from a file
        versions: ">=2026.0,<2027"
        checked_on: "2026.5"
        argv: [bstrings, -f, <file>, -o, <output file>]
    input_style: flag
    input_flag: "-f"
    output_format: text
    timeout_seconds: 600
    interactive: false
    description: "Binary string extraction with regex support"
    fk_tool_name: bstrings

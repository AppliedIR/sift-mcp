name: Quick Look Cache
description: "Thumbnail cache generated by macOS when files are previewed or displayed in Finder — retains low-resolution raster images that survive deletion of the original file, with entries for local files keyed by inode rather than by path"
platform: macos
platform_notes: |
  Quick Look is the macOS preview system. Thumbnails are produced by the com.apple.quicklook.ThumbnailsAgent daemon on behalf of any client that calls the QuickLookThumbnailing framework (QLThumbnailGenerator) — Finder icon, column and gallery views, Spotlight results, the Space-bar preview panel, and third-party applications. Generated bitmaps are written to a per-user cache that persists after the source file is deleted, which is the artifact's primary forensic value.

  Three properties dominate how it can be used, and each differs sharply from older published descriptions. Entries for local files are keyed by inode rather than by path: the index stores the inode number and the volume's fsid, and carries no filename, directory or extension anywhere, so a path can only be recovered by resolving the inode against a filesystem where the file still exists — precisely impossible for the deleted files that make the artifact interesting. Not every entry is a local file, though: a large share of rows carry identifiers that are not inodes at all, and separating those out is the first step of any analysis. The cache cannot be read on a live system, since the cache directory returns EPERM to stat, ls and find even for root with Full Disk Access, so collection requires an APFS snapshot, a Time Machine backup, or dead-box imaging. And the only timestamp is a last-access time that overwrites, so the time of a first preview is not recoverable.

  The index carries an internal schema version and Apple has changed this layout before, most recently dropping the path-bearing files table that older references still describe, so confirm the schema before relying on the decoding rules below. cloudthumbnails.db is the one exception to the no-path rule, recording last_seen_path for File Provider and cloud items.

locations:
  - path: "/private/var/folders/<x>/<hash>/C/com.apple.quicklook.ThumbnailsAgent/com.apple.QuickLook.thumbnailcache/"
    os_versions: ["macOS 15 (Sequoia)", "macOS 26 (Tahoe)"]
    notes: "Per-user Quick Look thumbnail cache. The <x>/<hash> segment is the per-user DARWIN_USER_CACHE_DIR — resolve it on a live system with `getconf DARWIN_USER_CACHE_DIR`, which returns the /var/folders form of the same path, or enumerate /private/var/folders/*/*/C/ on an image to cover every user. The protection boundary sits at this directory rather than at its parent: the enclosing com.apple.quicklook.ThumbnailsAgent directory stats normally, while this thumbnailcache directory returns EPERM to stat, ls and find even as root with Full Disk Access. An examiner can therefore confirm the cache exists on a live host without reading any of it — but the parent's mtime records only when the thumbnailcache subdirectory was created and does not advance as the cache is written, so it is no guide to activity. Collection still requires a snapshot, a Time Machine backup, or dead-box imaging."
  - path: "<cache>/index.sqlite"
    os_versions: ["macOS 15 (Sequoia)", "macOS 26 (Tahoe)"]
    notes: "SQLite index. Tables: basic_files(fileId, fsid, version), thumbnails(file_id, size, icon_mode, hit_count, last_hit_date, width, height, bitmapFormat, bitmapdata_location, bitmapdata_length, ...), provider_files, missing_remote_thumbnails, reserved_buffer, preferences. The database file itself is typically near-empty while the live data sits in index.sqlite-wal, routinely orders of magnitude larger. Always collect index.sqlite, -wal and -shm together or the index will appear empty."
  - path: "<cache>/thumbnails.data"
    os_versions: ["macOS 15 (Sequoia)", "macOS 26 (Tahoe)"]
    notes: "Flat blob store holding the raw bitmaps. Not a container format — thumbnails are addressed by byte offset and length from the index (bitmapdata_location / bitmapdata_length). Payloads are typically raw uncompressed 32-bit BGRA, sRGB, with no row padding, though a minority use a wider pixel format — verify per row against bitmapdata_length before decoding."
  - path: "<cache>/cloudthumbnails.db"
    os_versions: ["macOS 15 (Sequoia)", "macOS 26 (Tahoe)"]
    notes: "Separate SQLite database for File Provider / cloud-backed items (iCloud Drive and third-party providers). Schema: thumbnails(docid, vol_uuid, last_hit_date, last_seen_path TEXT, size). This is the only component of the Quick Look cache that records a file path. Empty on hosts with no cloud-provider activity. Collect it with its -wal and -shm files, as with the main index."
  - path: "<cache>/metadata, <cache>/resetreason, <cache>/exclusive, <cache>/thumbnails.fraghandler"
    os_versions: ["macOS 15 (Sequoia)", "macOS 26 (Tahoe)"]
    notes: "Supporting files. metadata is a small XML plist (QLCacheDebugModeMetadataKey). resetreason records why the cache was last reset — check it for evidence of a cache wipe. Low forensic value individually."

proves:
  - "That a thumbnail was generated for a specific file, identified by inode (basic_files.fileId where non-negative) and volume (basic_files.fsid). Entries whose fileId is negative do not represent files and cannot be identified this way."
  - "A low-resolution raster image of the file's content or type icon, recoverable from thumbnails.data even after the source file is deleted. The bitmap shows the file as it was when the thumbnail was generated, which is not necessarily last_hit_date — a cached image is re-served unchanged on later hits."
  - "The most recent time a cached thumbnail was served for a file (thumbnails.last_hit_date) and how many times it has been served (thumbnails.hit_count)"
  - "Which thumbnail sizes were requested for a file — separate rows per size, with the size column equal to the square pixel dimension. Small icon sizes dominate in practice, so most cached bitmaps are too small to show discernible content."
  - "Which Quick Look generator handled the file, from the bundle identifier embedded in the basic_files.version NSKeyedArchiver blob (for example com.apple.quicklook.thumbnail.TextExtension). Since the cache records no filename or extension, the generator is often the only indication of what kind of file it was."
  - "For cloud / File Provider items only: the last path at which the item was seen (cloudthumbnails.db.last_seen_path)"

does_not_prove:
  - "The path or filename of the previewed file. For entries representing local files the index stores an inode and fsid only, so paths must be recovered by resolving the inode against a filesystem where the file still exists — precisely impossible for the deleted files that make this artifact interesting. The one exception is cloudthumbnails.db, which records last_seen_path for File Provider and cloud items: the last path observed, not necessarily the path at the time of the preview."
  - "When a file was first previewed — last_hit_date is overwritten on every cache hit, and each hit also increments hit_count."
  - "That the user intentionally previewed the file — any process calling QLThumbnailGenerator populates the cache."
  - "The full-resolution content of the file — this store retains small thumbnails only, not full-size previews."
  - "The content of the file at all — for many file types the cached bitmap is a generic type icon carrying no content whatsoever (a .pem file rendered as Apple's stock certificate icon). Content-bearing thumbnails require a generator that renders the file."
  - "That a file was not previewed if it is absent from the cache — the cache is small and aggressively evicted."
  - "Which application requested the thumbnail. The generator recorded in basic_files.version is the plugin that rendered the file, not the client that called for it — Finder, Spotlight and any third-party application all produce identical entries."

timestamps:
  - field: "thumbnails.last_hit_date"
    meaning: "Mac absolute time (CFAbsoluteTime — seconds since 2001-01-01 UTC). The most recent time this cached thumbnail was served, whether newly generated or returned from cache."
    common_misinterpretation: "This is not the time the thumbnail was generated and not the time the file was first previewed. It is overwritten on every cache hit, so only the most recent preview of a file is represented. Pair it with hit_count: hit_count > 1 proves earlier previews occurred whose times are unrecoverable."
  - field: "cloudthumbnails.db thumbnails.last_hit_date"
    meaning: "Integer timestamp of the last thumbnail hit for a cloud / File Provider item."
    common_misinterpretation: "Stored as an integer here, unlike the REAL-typed last_hit_date in index.sqlite. Confirm the epoch before converting rather than assuming it matches the main index."

common_misinterpretations:
  - claim: "The Quick Look cache index maps original file paths to cached thumbnails"
    correction: "It does not, and this is the most consequential error to avoid with this artifact. The index stores basic_files(fileId, fsid, version) where fileId is the inode number for entries representing local files — there is no path, filename, or extension column anywhere in index.sqlite. Older published descriptions of Quick Look (which describe a files table with folder and file_name columns) do not match the current schema. Only cloudthumbnails.db, covering cloud-provider items, records a path."
  - claim: "A cached thumbnail shows what the file looked like"
    correction: "Only for file types with a content-rendering generator. Many types produce a generic type icon that reveals nothing about content — a .pem file caches as Apple's stock certificate icon. Even where a generator does render the file, most cached bitmaps are 16 or 32 px square, at which nothing is legible: a text document is recognisably document-shaped and no more. Inspect the extracted bitmap before characterising it as content evidence."
  - claim: "The Quick Look cache can be collected during live response"
    correction: "Not on current macOS. The thumbnailcache directory returns EPERM to stat, ls and find even for root with Full Disk Access, so a live `find` returns nothing at all, which is easily mistaken for the cache being absent. Its parent com.apple.quicklook.ThumbnailsAgent does stat normally, so presence can be confirmed live even though nothing inside can be read. Collect via an APFS snapshot mounted read-only, a Time Machine backup, or dead-box imaging."
  - claim: "qlmanage can be used to extract cached thumbnails"
    correction: "qlmanage has no capability to read or dump the cache. Its cache-relevant options are actively harmful to evidence: `qlmanage -r cache` resets (destroys) the thumbnail disk cache, and `-t` / `-p` generate thumbnails, which writes new entries into the cache of whichever system runs them. Never run qlmanage against evidence."
  - claim: "Deleting a file removes its Quick Look cache entry"
    correction: "It does not. A file that is thumbnailed and then deleted leaves its cached bitmaps intact and recoverable. This survival is the artifact's primary forensic value."

corroborate_with:
  for_execution: []
  for_presence: [spotlight, fsevents, apfs_snapshots, time_machine, quarantine]
  for_timeline: [unified_logging, knowledgec_biome]

related_tools: [sqlite3, tmutil, mount_apfs, diskutil, mac_apt]

cross_mcp_checks:
  - mcp: "forensic-rag"
    tool: "search"
    when: "Quick Look cache schema or decoding differs from what is documented here — search for version-specific Quick Look research before trusting the join and offset rules on a system whose preferences.version differs from the one you validated against"
  - mcp: "opencti"
    tool: "lookup_ioc"
    when: "A recovered thumbnail legibly reveals an indicator — a domain, URL, wallet address, or document header — check it against threat intelligence"

references:
  - "Apple — QuickLookThumbnailing framework documentation (QLThumbnailGenerator)"
  - "Apple — qlmanage(1), mount_apfs(8), tmutil(8) man pages"
  - "mac_apt — QUICKLOOK plugin (plugins/quicklook.py)"
  - "SANS FOR518 — Mac and iOS Forensic Analysis"

investigation_patterns:
  - name: "Collect the cache (required first step — it cannot be read live)"
    note: |
      The cache directory returns EPERM on a live system even to root with Full Disk Access. A live `find` for it returns nothing, which is easily misread as the cache being absent. Collect through a snapshot instead.

      On a live host, mount a read-only snapshot of the DATA volume. Prefer an existing snapshot where one is present — on a Time Machine-enabled host they accumulate hourly — rather than creating a new artifact on a subject system:
      `tmutil listlocalsnapshots /System/Volumes/Data`
      `sudo tmutil localsnapshot`   # only if none exists; records an examiner-created artifact
      `diskutil info /System/Volumes/Data | grep "Device Node"`   # e.g. /dev/disk4s5
      `sudo mkdir -p /private/tmp/snap`
      `sudo mount_apfs -o ro -s <snapshot_name> /dev/<data_device> /private/tmp/snap`

      Do not use /mnt as the mount point. It does not exist on macOS and cannot be created, because the root volume is sealed and read-only.

      CRITICAL: pass the DATA volume device, not the boot device. Mounting a System-volume snapshot of the running boot volume hung a Sequoia 15.6.1 host and required a forced power off — see the apfs_snapshots artifact.

      Resolve the per-user cache path (run as the target user):
      `getconf DARWIN_USER_CACHE_DIR`

      Copy the whole set — each database is near-empty without its WAL:
      `sudo cp /private/tmp/snap/private/var/folders/<x>/<hash>/C/com.apple.quicklook.ThumbnailsAgent/com.apple.QuickLook.thumbnailcache/{index.sqlite,index.sqlite-wal,index.sqlite-shm,thumbnails.data,cloudthumbnails.db,cloudthumbnails.db-wal,cloudthumbnails.db-shm,resetreason} <evidence_dir>/`

      Verify the copy parses before relying on it, then tear down:
      `sqlite3 <evidence_dir>/index.sqlite "SELECT count(*) FROM thumbnails;"`
      `sudo umount /private/tmp/snap`
      `sudo tmutil deletelocalsnapshots <YYYY-MM-DD-HHMMSS>`   # only if you created it

      On a disk image, enumerate every user: /private/var/folders/*/*/C/com.apple.quicklook.ThumbnailsAgent/
    follow_up: "Unmount and delete any snapshot created for collection. Record in notes that the snapshot was examiner-created so it is not later mistaken for system-generated evidence. Check resetreason for signs the cache was wiped before collection."

  - name: "Decode the index and join thumbnails to files"
    note: |
      thumbnails.file_id carries the item identifier with the sign bit set; basic_files.fileId holds it without. Join them in SQLite with a bitwise OR, which stays in integer domain:

      `SELECT b.fileId, b.fsid, t.size, t.width, t.height, t.hit_count, datetime(t.last_hit_date+978307200,'unixepoch') AS last_hit, t.bitmapdata_location, t.bitmapdata_length FROM thumbnails t JOIN basic_files b ON (b.fileId | -9223372036854775808) = t.file_id;`

      Do not decode with file_id + 2**63 in SQLite. That addition is coerced to a double and silently corrupts the low bits — on tested data it produced 960512.0 where the true value was 961002, close enough to look plausible and wrong enough to resolve to nothing. Python's arbitrary-precision integers make the same addition safe.

      Only some entries are files. Separate the populations before treating any identifier as an inode: rows with basic_files.fileId >= 0 are inode-keyed and correspond to real files, while rows with a negative fileId pass through to thumbnails.file_id untransformed, carry a distinct synthetic fsid, and decode to values far outside any inode range. On a tested host only 5 of 83 distinct cached items were inode-keyed.

      Cross-check the join: every thumbnails row should match a basic_files row. If rows fail to match, the schema has changed and the rule must be re-derived before any finding rests on it.
    follow_up: "Note that a file appears once per cached size (16/32/64/128 px), so row count exceeds file count. hit_count > 1 proves previews earlier than last_hit_date occurred, at times that are not recoverable."

  - name: "Extract cached bitmaps from thumbnails.data"
    note: |
      Thumbnails are addressed by byte offset and length into thumbnails.data. The payload is raw uncompressed 32-bit BGRA, sRGB, no row padding — confirm per row with bitmapdata_length == width * height * 4. Most rows satisfy it, but not all: on a tested host 4 of 147 carried exactly twice the expected bytes, meaning 8 bytes per pixel rather than 4, and decoding those as 32-bit BGRA yields a garbled image. There is no image header to carve for; the bytes are meaningless without the index.

      Read blob[bitmapdata_location : bitmapdata_location + bitmapdata_length], then reorder each 4-byte pixel from BGRA to RGB and write a PNG.

      The bitmapFormat column holds an NSKeyedArchiver plist (QLTBitmapFormat) recording bits-per-pixel, bytes-per-row, and colour space. Parse it rather than assuming the layout wherever the length check fails.
    follow_up: "Inspect every extracted image before characterising it. Distinguish content renderings from generic type icons — an icon proves a thumbnail was requested but reveals nothing about file content. Most cached bitmaps are 16 or 32 px square, at which nothing is legible. Hash extracted images and record the offset and length each came from so the extraction is reproducible."

  - name: "Resolve inodes to paths — and document the limit"
    note: |
      The cache names no files. To attach identities, build an inode-to-path map from the filesystem under examination and join it to the decoded inodes:
      `sudo find /Users -type f -print0 | sudo xargs -0 stat -f "%i|%N" > inode_map.txt`

      Use the same filesystem the cache came from — a mounted image or the snapshot used for collection — not a different host, and beware descending into a snapshot mounted beneath the search root, which yields duplicate inodes at examiner-created paths.

      Restrict to inode-keyed rows first: entries whose basic_files.fileId is negative are not files and will never resolve, and on a tested host those were the large majority. Among inode-keyed rows, those that fail to resolve are the forensically interesting ones — a thumbnail exists for a file no longer present at any path. Report these as "an unnamed file, inode N on volume fsid F, was previewed", since the name is not recoverable from this artifact.
    follow_up: "For unresolved inodes, pivot to spotlight (the metadata store retains inode-to-name mappings for indexed files), to time_machine or apfs_snapshots for an older filesystem state where the inode still resolves, and to quarantine if the file may have been downloaded. APFS allocates file IDs from an increasing counter and does not reuse them after deletion, so a resolved inode on an APFS volume identifies one file; that does not hold for HFS+ or other filesystems on external media, which the fsid column distinguishes."

  - name: "Check cloudthumbnails.db for path-bearing entries"
    note: |
      cloudthumbnails.db is the only part of the cache that records a path:
      `sqlite3 cloudthumbnails.db "SELECT docid, hex(vol_uuid), last_hit_date, last_seen_path, size FROM thumbnails ORDER BY last_hit_date DESC;"`
      It covers iCloud Drive and third-party File Provider items only, and is empty on hosts with no cloud-provider activity. Collect its -wal and -shm alongside it — this database carries a substantial WAL even when the table reads empty, so a count taken from the .db alone is not trustworthy.
    follow_up: "last_seen_path is the last path observed, not necessarily the path at preview time. Corroborate against the provider's own metadata and against spotlight before relying on it."

  - name: "Evidence-handling caution — do not run qlmanage"
    note: |
      qlmanage cannot read this cache and both of its relevant modes damage it: `qlmanage -r cache` resets (destroys) the thumbnail disk cache, and `qlmanage -t` / `-p` generate thumbnails, writing new entries into the cache of the system that runs them.

      Previewing files in Finder on an examiner workstation has the same effect on the examiner's own cache and, if evidence is mounted read-write, may alter the source. Mount evidence read-only.
    follow_up: "If a wipe is suspected, check resetreason in the cache directory and query Unified Logging for com.apple.quicklook activity around the suspected time. Note that Unified Logging redacts file identifiers as <private>, so it can establish that thumbnailing or a reset occurred but never which file was involved."

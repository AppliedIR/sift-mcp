name: Amcache
description: "Program and file inventory hive (Amcache.hve), written by Windows compatibility and inventory tasks."
platform: windows

locations:
  - path: "C:\\Windows\\AppCompat\\Programs\\Amcache.hve"
    os_versions: ["Windows 7 and Server 2008 R2 and later", "Windows 10", "Windows 11", "Server 2025"]
    notes: "Collect Amcache.hve.LOG1 and Amcache.hve.LOG2 from the same folder."

proves:
  - "File was present on the system"
  - "A SHA-1 hash recorded for the file. For files over 31,457,280 bytes (30 MiB), the hash covers only the first 31,457,280 bytes."

does_not_prove:
  - "File was executed. Windows adds entries for files that never ran. In testing, never-run files in Program Files, on the Desktop and behind Start Menu shortcuts got entries."
  - "File was executed at the recorded timestamp"
  - "File was absent. In testing, never-run files in Downloads, the profile folder, C:\\Tools, LocalAppData\\Programs and ProgramData had no entry. A hive copied without its transaction logs can also lack recent entries."

timestamps:
  - field: "FileKeyLastWriteTimestamp"
    meaning: "When the Amcache registry key was last modified"
    common_misinterpretation: "Often mistaken for execution time"

common_misinterpretations:
  - claim: "This program was executed based on Amcache"
    correction: "Amcache shows a file was present. It does not show the file ran. Windows inventory tasks can add entries for files that were never started. Confirm execution with Prefetch, UserAssist, BAM or a process creation event."
  - claim: "FileKeyLastWriteTimestamp shows when the file first appeared on the system"
    correction: "The key time is the last time a Windows inventory task wrote the entry. Many entries often share one time. On older builds the documented writer is the Microsoft Compatibility Appraiser task. In testing on Windows 11 26H2 and Server 2025, the writes fell during a run of the MareBackup task. The time shows the file was present by then. It does not show when the file arrived or ran. For arrival, use the $MFT Created times and the USN journal."

corroborate_with:
  for_execution: [prefetch, userassist, bam]
  for_presence: [mft, shimcache]
  for_timeline: [usn_journal, event_logs]

related_tools: [AmcacheParser, RECmd]

cross_mcp_checks:
  - mcp: "windows-triage"
    tool: "check_file"
    when: "Executable path identified — verify against Windows baseline"
  - mcp: "opencti"
    tool: "lookup_ioc"
    when: "File hash available — check threat intelligence"
  - mcp: "forensic-rag"
    tool: "search_knowledge"
    when: "Suspicious executable or pattern — search for related MITRE techniques and detection rules"
  - mcp: "remnux"
    tool: "analyze_file"
    when: "Unknown executable — submit for static analysis"

references:
  - "SANS FOR500 - Windows Forensic Analysis"

investigation_patterns:
  - name: "Programs without installer record"
    query: "NOT KeyName:*Microsoft* AND NOT KeyName:*Windows*"
    purpose: "Executables registered without a standard installer — potential manually deployed tools"
    caveat: "Amcache proves PRESENCE and provides SHA1 hash, never execution"
    follow_up: "windows-triage check_file with SHA1, opencti lookup_ioc for hash"

  - name: "Recently registered executables"
    query: "FileKeyLastWriteTimestamp:[time_from TO time_to]"
    purpose: "Executables registered during the incident window"
    caveat: "FileKeyLastWriteTimestamp is when the registry key was modified, not when the file ran"

  - name: "Cross-host hash correlation"
    query: "SHA1.keyword:<hash>"
    index: "case-*-amcache-*"
    purpose: "Same binary hash on multiple hosts — confirms deployment scope"
    follow_up: "opencti lookup_ioc for the SHA1 hash, windows-triage check_hash for vulnerable drivers"

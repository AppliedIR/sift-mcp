name: MFT
description: "NTFS Master File Table containing metadata for every file and directory on an NTFS volume"
platform: windows

locations:
  - path: "$MFT (root of each NTFS volume)"
    os_versions: ["Windows XP+", "Windows 10", "Windows 11"]
    notes: "Located at the root of every NTFS volume; not directly accessible via normal file system APIs on a live system"

proves:
  - "File or directory existed on the volume"
  - "File size (both logical and physical allocation)"
  - "File timestamps (creation, modification, access, entry modification)"
  - "Parent directory relationship"
  - "Whether file is resident (small files stored directly in MFT) or non-resident"
  - "Alternate data streams exist"

does_not_prove:
  - "File was executed"
  - "Who created or modified the file"
  - "File content (unless resident and MFT entry is intact)"
  - "That timestamps are accurate (SI timestamps can be modified by user-mode APIs)"

timestamps:
  - field: "$STANDARD_INFORMATION Created"
    meaning: "File creation time as recorded in $STANDARD_INFORMATION attribute"
    common_misinterpretation: "Can be modified (timestomped) by user-mode applications via SetFileTime API"
  - field: "$STANDARD_INFORMATION Modified"
    meaning: "Last data modification time in $STANDARD_INFORMATION"
    common_misinterpretation: "Can be timestomped; does not distinguish between content types modified"
  - field: "$STANDARD_INFORMATION Accessed"
    meaning: "Last access time in $STANDARD_INFORMATION"
    common_misinterpretation: "Controlled by NtfsDisableLastAccessUpdate (SYSTEM\\<ControlSet>\\Control\\FileSystem); check its value in the SYSTEM hive. Often shows creation time."
  - field: "$STANDARD_INFORMATION Entry Modified"
    meaning: "Last time the MFT entry metadata was changed"
    common_misinterpretation: "Can be timestomped; not the same as file content modification"
  - field: "$FILE_NAME Created"
    meaning: "File creation time in $FILE_NAME attribute"
    common_misinterpretation: "No documented user-mode API sets it, but NTFS rewrites it on ordinary operations: a rename or same-volume move copies the file's $SI values from before the operation into it, so a timestomped $SI can be carried into $FN. A difference between $SI and $FN can indicate timestomping; treat it as a lead for further comparison, not proof."
  - field: "$FILE_NAME Modified"
    meaning: "Last modification time in $FILE_NAME attribute"
    common_misinterpretation: "Updated only on file rename/move operations, not on content changes"

common_misinterpretations:
  - claim: "File timestamps in the MFT are always reliable"
    correction: "$STANDARD_INFORMATION timestamps can be trivially modified via SetFileTime (timestomping). Compare with $FILE_NAME timestamps to detect tampering."
  - claim: "$FILE_NAME timestamps always match $STANDARD_INFORMATION timestamps"
    correction: "FN timestamps are set at file creation and updated only on rename/move. Legitimate divergence is normal. SI timestamps earlier than FN timestamps are common on an ordinary Windows system volume, especially in WinSxS, System32 and WindowsApps, and after robocopy copies or shell zip extraction; they can also indicate timestomping. Judge a hit by the file's location and its dates against the other evidence; treat it as a lead, not proof."
  - claim: "Deleted file MFT entries are immediately overwritten"
    correction: "MFT entries for deleted files are marked as free but may persist for extended periods until the entry is reallocated to a new file."
  - claim: "Last access time is always updated"
    correction: "Whether NTFS updates Last Access is controlled by NtfsDisableLastAccessUpdate (SYSTEM\\<ControlSet>\\Control\\FileSystem); check its value in the SYSTEM hive. Even when updates are on, NTFS can delay them by up to an hour. The last access timestamp can be stale."

corroborate_with:
  for_execution: [prefetch, amcache, bam]
  for_presence: [shimcache, amcache, usn_journal]
  for_timeline: [usn_journal, event_logs_security, prefetch]

related_tools: [MFTECmd, istat, fls]

cross_mcp_checks:
  - mcp: "windows-triage"
    tool: "check_file"
    when: "File path identified — verify against Windows baseline"
  - mcp: "opencti"
    tool: "lookup_ioc"
    when: "File hash available — check threat intelligence"
  - mcp: "forensic-rag"
    tool: "search_knowledge"
    when: "Suspicious file activity pattern — search for related techniques"

references:
  - "SANS FOR500 - Windows Forensic Analysis"
  - "SANS FOR508 - Advanced Incident Response"
  - "Brian Carrier - File System Forensic Analysis"

cross_artifact_correlation:
  - pattern: "Timestomping detection — $SI vs $FN"
    fields: ["SI<FN"]
    note: "SI<FN=True marks a file for review. It does not alone mean the file is suspicious. It often legitimately occurs in WinSxS, System32 and WindowsApps. It also occurs after a file is copied with robocopy or extracted from a zip archive in File Explorer. Renaming or moving a timestomped file within the same volume copies its timestomped $SI timestamps into $FN, so SI<FN becomes False. The USN journal can help. Its records of when the file was created and when its content changed can be compared with the $SI times."

  - pattern: "Timestomping detection — zero sub-second $SI times"
    fields: ["uSecZeros"]
    note: "uSecZeros=True marks a file for review. It does not alone mean the file is suspicious. It often legitimately occurs after a file is extracted from a zip archive or copied from FAT-formatted media. A timestomp that sets non-zero sub-second values leaves uSecZeros=False. The USN journal can help. Its records of when the file was created and when its content changed can be compared with the $SI times."

  - pattern: "Timestomping detection — $SI vs Shimcache"
    cross_ref: "Shimcache"
    note: "Compare MFT $SI Modified time to shimcache LastModifiedTime for same executable. If $SI Modified is earlier than the cached value, the time was set backwards after caching. Consider this a lead for potential timestomping."

  - pattern: "Timestomping detection — $SI vs PE compile time"
    note: "Use exiftool to extract the PE compile timestamp and compare it with $SI Modified."

  - pattern: "Deleted file + execution proof"
    fields: ["InUse"]
    cross_ref: "Prefetch"
    note: "InUse=False + matching Prefetch entry = executed then deleted (anti-forensics)"

  - pattern: "ADS extraction"
    fields: ["HasAds"]
    deep_analysis: "icat with ADS inode format (inode-type-id) via run_command"
    note: "HasAds=True in suspicious paths warrants ADS content extraction"

  - pattern: "Downloaded code detection"
    fields: ["ZoneIdContents"]
    query: "ZoneIdContents:* AND FileName:(*.exe OR *.dll OR *.ps1 OR *.bat OR *.vbs OR *.js OR *.wsf OR *.hta OR *.msi OR *.scr)"
    purpose: "Find downloaded scripts and executables — Zone.Identifier proves internet or network origin"
    follow_up: "Check hash via windows-triage check_file and opencti lookup_ioc"

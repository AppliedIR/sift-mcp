name: autorunsc
category: persistence
description: "Sysinternals command-line tool to enumerate Windows auto-start extensibility points (ASEPs) for persistence detection"
platform: [windows]
platform_notes: "Windows only (Sysinternals). For offline registry persistence analysis on Linux, use RECmd with appropriate batch files."
artifacts_parsed: [registry_run_keys, scheduled_tasks, registry_services, wmi_persistence]

caveats:
  - "Offline scanning is limited to registry-based ASEPs. It does NOT detect WMI persistence or scheduled tasks. Find those with separate artifact analysis."
  - "Requires elevated privileges for complete enumeration"
  - "Not all persistence mechanisms are covered (e.g., DLL search order hijacking, COM object hijacking)"
  - "Through wintools-mcp, the VirusTotal options are refused. They would send file hashes to VirusTotal over the internet. Check a hash with threat intelligence instead (opencti: lookup_ioc)."
  - "Results reflect the image's state at the time it was collected. Persistence removed before collection is not visible in the results."
  - "Compare with offline registry analysis to detect persistence that was removed or tampered with"

output_notes:
  format: csv
  key_fields: [Entry_Location, Entry, Enabled, Category, Profile, Description, Publisher, Image_Path, Launch_String, MD5, SHA1, SHA256]

advisories:
  - "Scan all auto-start location types, not a subset."
  - "Ask for CSV output. It is easier to sort, filter and compare than the default text output."
  - "Include file hashes in the output, so entries can be checked against threat intelligence."
  - "Include signature checks in the output. An unsigned entry is a lead to examine. It is not proof of malicious persistence."
  - "Hiding Microsoft-signed entries narrows the output to third-party and unsigned items. A legitimate binary can be hijacked, so review the hidden entries too."
  - "Compare the output with output from a known-good image, or from an earlier image of the same host, to find new persistence. Entries that differ are leads. They are not proof of malicious persistence."
  - "Combine with offline RECmd analysis for tamper detection"


investigation_sequence:
  - "Run autorunsc (via wintools-mcp) in offline mode against a Windows image in the case, to list its Auto-Start Extensibility Points (ASEPs). wintools-mcp refuses a run that would scan the wintools host itself."
  - "Ask for CSV output with file hashes, for structured analysis. get_windows_tool_help shows these options for the installed version."
  - "Include signature checks, to see which entries are signed."
  - "Review ALL entries including Microsoft-signed items — legitimate binaries can be hijacked"
  - "Hide Microsoft-signed entries only for a first triage pass. Then review the full results."
  - "Cross-reference unsigned or suspicious entries with sigcheck for deeper analysis"
  - "Check file hashes against threat intelligence sources"
  - "Through wintools-mcp, offline mode is required. Give it the image's Windows folder and a user profile folder, both inside the case."
  - "Correlate persistence entries with execution evidence such as Prefetch and process creation events. Amcache can add presence and hashes."
  - "Cross-MCP: Verify entries against Windows autorun baseline (windows-triage: check_autorun)"
  - "Cross-MCP: Check unsigned entry hashes against threat intelligence (opencti: lookup_ioc)"
  - "Cross-MCP: Run autorunsc on offline evidence via Windows forensic workstation (wintools-mcp: run_windows_command)"

cross_mcp_checks:
  - mcp: "windows-triage"
    tool: "check_autorun"
    when: "Autorun entry found — verify against Windows baseline"
  - mcp: "wintools-mcp"
    tool: "run_windows_command"
    when: "Windows forensic workstation available — run autorunsc in offline mode on a Windows image in the case to list its ASEPs. get_windows_tool_help shows the offline-mode arguments for the installed version."
  - mcp: "opencti"
    tool: "lookup_ioc"
    when: "Unsigned autorun entry — check file hash against threat intelligence"

field_meanings:
  Time: "Timestamp associated with the autorun entry"
  "Entry Location": "Registry key or file system location of the ASEP"
  Entry: "Name or identifier of the autorun entry"
  Enabled: "Whether the autorun entry is currently enabled"
  Category: "ASEP category (Logon, Services, Drivers, Scheduled Tasks, etc.)"
  Profile: "User profile associated with the entry (if applicable)"
  Description: "File description from PE version information"
  Signer: "Digital signature signer name"
  Company: "Company name from PE version information"
  "Image Path": "Full path to the executable"
  Version: "File version string"
  "Launch String": "Full command line used to launch the entry"
  MD5: "MD5 hash of the file"
  "SHA-1": "SHA-1 hash of the file"
  SHA-256: "SHA-256 hash of the file"
  "PESHA-256": "SHA-256 hash of the PE image (excludes signature data)"
  IMP: "Import hash (imphash) for behavioral similarity comparison"

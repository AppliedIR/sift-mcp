name: KAPE
category: triage
description: "Kroll Artifact Parser and Extractor. KAPE collects artifacts with targets and processes them with modules. Through wintools-mcp, only module runs on files already in the case are allowed. Target runs are refused."
platform: [windows]
platform_notes: "Windows only. Targets are Windows-specific. Modules can invoke other tools. No Linux equivalent (use tar/find for Linux collection)."
artifacts_parsed: []

caveats:
  - "A KAPE collection holds only what its targets selected. Before concluding that an artifact is absent, check whether the collection's targets covered it."
  - "KAPE modules can execute arbitrary commands. Review a module's configuration before running it."
  - "Some modules gather live data from the machine they run on instead of parsing collected files. Through wintools-mcp, that machine is the wintools host, not the evidence. Run only modules that parse files already in the case. wintools-mcp does not block live-data modules, so this choice is yours to get right."
  - "Target definitions may not cover custom or unusual artifact locations. An artifact missing from a collection may still exist on the host."
  - "KAPE is licensed software requiring agreement to Kroll's terms"

output_notes:
  format: mixed
  key_fields: [processed_output, execution_log]

advisories:
  - "Read a module's documentation before running it. Know which files it reads and what it writes."
  - "Through wintools-mcp, KAPE runs modules only. Target runs collect from a drive, so wintools-mcp refuses them. A KAPE collection made earlier by the examiner can be processed with modules once it is in the case."
  - "KAPE modules can run Zimmerman tools, RegRipper, and other parsers automatically"
  - "Check KAPE's log output after a module run. Confirm that each module ran and wrote output before relying on the results."


investigation_sequence:
  - "Find the collected files in the case that the module needs as input"
  - "Process collected artifacts with module configurations for automated parsing"
  - "Review all module output. A module parses only the files present in its input folder. An artifact missing from a collection may still exist on the host."
  - "Record which modules ran and which input folder they read, for the investigation record"

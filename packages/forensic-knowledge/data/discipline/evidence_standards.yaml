standards:
  CONFIRMED:
    level: 1
    description: "PLACEHOLDER (wording awaits approval): The evidence directly shows the claim, and nothing contradicts it."
  INDICATED:
    level: 2
    description: "PLACEHOLDER (wording awaits approval): The evidence points to the claim but does not establish it."
  INFERRED:
    level: 3
    description: "PLACEHOLDER (wording awaits approval): Deduced from the evidence, not directly observed; state the reasoning chain."
  UNKNOWN:
    level: 4
    description: "Insufficient evidence to classify. Not-in-database is neutral, not suspicious."
  CONTRADICTED:
    level: 5
    description: "Evidence directly contradicts the claim."

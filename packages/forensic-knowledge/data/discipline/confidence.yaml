levels:
  HIGH:
    criteria: "The cited evidence shows it directly, the other artifacts you checked agree, and nothing you found contradicts it. HIGH isn't certainty: it can still be wrong."
  MEDIUM:
    criteria: "The evidence is credible and supports it, but it isn't corroborated or direct enough for HIGH, or another reading is still open."
  LOW:
    criteria: "It rests on significant assumptions, on fragmented or uncorroborated evidence, or on an artifact or tool that's unreliable for this claim."
  SPECULATIVE:
    criteria: "A hypothesis with no direct evidence yet. Label it as one, and don't build on it."

levels:
  HIGH:
    criteria: "PLACEHOLDER (wording awaits approval): The evidence is direct and from reliable sources, it agrees where it was checked, nothing contradicts it, and no known gap would change the conclusion."
  MEDIUM:
    criteria: "PLACEHOLDER (wording awaits approval): The evidence supports the claim but is indirect or of one kind, or an alternative or a gap remains open."
  LOW:
    criteria: "PLACEHOLDER (wording awaits approval): A reasonable inference from limited or indirect evidence; significant gaps or alternatives remain."
  SPECULATIVE:
    criteria: "PLACEHOLDER (wording awaits approval): A hypothesis with no direct evidence yet; label it as one."

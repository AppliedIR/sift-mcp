# managed-by: valhuntir
# Codex's managed requirements on this SIFT workstation, installed by
# `vhir setup client --client=codex` (root-owned; every Codex session on the
# machine follows them). {home} is the examiner's home and {hooks} the
# root-owned copies of Valhuntir's hooks. To turn them off, see
# sift-mcp/docs/codex.md#opt-out.

# Codex's own sandbox stays on: only these permission profiles, no
# danger-full-access; the default keeps ~/.vhir read-only
default_permissions = "vhir"
allowed_approval_policies = ["untrusted", "on-request", "never"]
# web search stays off: hosted tools fire no hooks, so nothing would audit it
allowed_web_search_modes = []

[allowed_permission_profiles]
vhir = true
":read-only" = true

[features]
hooks = true
browser_use = false
computer_use = false
in_app_browser = false

# The workspace, with ~/.vhir read-only: the shell can't change the active
# case, the hooks, the config or the venv
[permissions.vhir]
extends = ":workspace"

[permissions.vhir.filesystem]
"{home}/.vhir" = "read"

# Codex's shell can't read the signing and approval store, the gateway's
# tokens or the Valhuntir profile (which holds a gateway token)
[permissions.filesystem]
deny_read = ["/var/lib/vhir", "{home}/.vhir/gateway.yaml", "{home}/.codex/valhuntir.config.toml"]

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "{hooks}/case-data-guard.sh"
timeout = 10

# The finding-skeptic gets Claude's skeptic's read and query tools only
[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "{hooks}/codex-skeptic-tools.sh"
timeout = 10

[[hooks.PostToolUse]]
matcher = "^(Bash|apply_patch)$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "{hooks}/forensic-audit.sh --client codex"
timeout = 30

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "{hooks}/codex-stdin-capture.sh"
timeout = 30

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "{hooks}/case-dir-check.sh --client codex"
timeout = 10

# The same forensic-rules reminder Claude Code's hook prints, before each prompt
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "cat << 'EOF'\n<forensic-rules>\nPLAN before 3+ steps | EVIDENCE for claims | APPROVAL before conclusions\nRECORD actions via forensic-mcp | NO DELETE without approval\n</forensic-rules>\nEOF"
timeout = 10
